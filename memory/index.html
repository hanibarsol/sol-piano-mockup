<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>מי מסתתר כאן?</title>
<style>
  :root{
    --purple:#43225A; --orange:#F2A412; --turq:#189E8A;
    /* צבעי התווים הקבועים של סול */
    --c-do:#ff6b6b; --c-re:#ffa35c; --c-mi:#f2cf52; --c-fa:#5fcb82;
    --c-sol:#5cacea; --c-la:#9c86ea; --c-si:#e37bcb;
    --card:#f7f7f7;   /* זהה לרקע ההנפשות, אחרת נראה ריבוע אפרפר בתוך הקלף */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#2d1740; color:#fff; overflow:hidden;
    font-family:system-ui,"Segoe UI",Arial,sans-serif;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }

  /* ---------- מסך פתיחה ---------- */
  #start{
    position:fixed; inset:0; z-index:100; background:#2d1740;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  #start[hidden]{display:none !important}
  #start h1{margin:0; font-size:clamp(20px,6dvh,32px); font-weight:800; line-height:1.4}
  #start p{margin:0; font-size:clamp(13px,3dvh,16px); font-weight:600; opacity:.85}
  #go{
    border:none; border-radius:999px; background:var(--turq); color:#fff; cursor:pointer;
    padding:clamp(11px,2.4dvh,16px) clamp(26px,7vw,46px);
    font-size:clamp(15px,3.4dvh,20px); font-weight:800;
    box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  #go:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.3)}

  /* ---------- הלוח ---------- */
  #board{
    height:100%;
    display:grid; gap:clamp(5px,1.4vmin,12px);
    grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(2,1fr);
    padding:clamp(6px,1.6vmin,14px);
    padding-left:max(clamp(6px,1.6vmin,14px),env(safe-area-inset-left,0px));
    padding-right:max(clamp(6px,1.6vmin,14px),env(safe-area-inset-right,0px));
  }
  @media (orientation:portrait){
    #board{grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr)}
  }

  .card{ cursor:pointer; min-width:0; min-height:0 }
  .card.dealing{ transition:transform .4s cubic-bezier(.2,.9,.3,1) }
  .inner{ position:relative; width:100%; height:100% }
  .inner.flip{ animation:flip .42s cubic-bezier(.4,.1,.4,1) }
  @keyframes flip{ 0%{transform:scaleX(1)} 50%{transform:scaleX(.04)} 100%{transform:scaleX(1)} }

  .face{
    position:absolute; inset:0;
    border-radius:clamp(8px,1.8vmin,16px);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .back{
    background:linear-gradient(160deg,#2FC3AC,var(--turq));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 0 3px 0 rgba(0,0,0,.25);
  }
  .back svg{width:52%; height:52%; display:block}
  .front{
    background:var(--card); box-shadow:0 3px 0 rgba(0,0,0,.25); padding:6%;
  }
  .front img{max-width:100%; max-height:100%; object-fit:contain; pointer-events:none}

  /* ההנפשה יושבת בדיוק על התמונה ומתחלפת איתה במעבר רך */
  .front .clip{
    position:absolute; left:6%; top:6%;
    width:88%; height:88%;          /* חובה. בלי רוחב וגובה הווידאו מתעלם מ-inset */
    object-fit:contain;
    opacity:0; pointer-events:none; background:transparent;
    transition:opacity .18s linear;
  }
  .front img{ transition:opacity .18s linear }
  .card.playing .front .clip{ opacity:1 }
  .card.playing .front img{ opacity:0 }

  .back, .front{ transition:opacity 0s linear .21s }
  .back{ opacity:1 }
  .front{ opacity:0 }
  .card.up .back{ opacity:0 }
  .card.up .front{ opacity:1 }

  .card.done .front{ box-shadow:0 0 0 3px var(--orange), 0 3px 0 rgba(0,0,0,.25) }

  /* הדמות קופצת החוצה מהקלף וחוזרת. overflow:visible הוא מה שמאפשר לה לצאת. */
  /* נפילה לאחור כשההנפשה לא יוצאת לדרך: פעימה עדינה וישרה, הדמות נשארת זקופה */
  .card.jump .front img{ animation:jump .6s ease }
  @keyframes jump{
    0%   { transform:scale(1) }
    45%  { transform:scale(1.07) }
    100% { transform:scale(1) }
  }

  /* סרטון הסיום: המשפחה הולכת יחד אל האור, אחרי שכולם נמצאו */
  #ending{
    position:fixed; inset:0; z-index:80; display:none;
    background:#140820; opacity:0; transition:opacity .5s ease;
    align-items:center; justify-content:center;
  }
  #ending.on{display:flex}
  #ending.vis{opacity:1}
  #ending.out{opacity:0; transition:opacity .6s ease}
  #ending video{
    width:100%; height:100%; object-fit:contain; display:block;
    background:#140820;
  }

  /* ---------- סיום ---------- */
  #again{
    position:fixed; z-index:60; left:50%; bottom:max(12px,env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) scale(.6); opacity:0; pointer-events:none;
    border:none; border-radius:999px; background:var(--orange); color:#3a2300;
    padding:clamp(9px,2dvh,14px) clamp(20px,6vw,34px);
    font-size:clamp(14px,3dvh,18px); font-weight:800; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.3); transition:opacity .3s, transform .3s;
  }
  #again.show{ opacity:1; transform:translateX(-50%) scale(1); pointer-events:auto }

  /* ---------- כפתור המוזיקה ---------- */
  #mute{
    position:fixed; z-index:70;
    top:max(10px,env(safe-area-inset-top,0px));
    left:max(10px,env(safe-area-inset-left,0px));
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(20,8,32,.62); color:#fff;
    display:none; align-items:center; justify-content:center;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  #mute.show{display:flex}
  #mute svg{width:22px; height:22px; display:block}
  #mute .slash{display:none}
  #mute.off{background:rgba(20,8,32,.45); color:rgba(255,255,255,.6)}
  #mute.off .slash{display:block}
  #mute.off .waves{display:none}
  #mute:active{transform:scale(.92)}

  @media (prefers-reduced-motion:reduce){
    .inner.flip{animation:none} .card.jump .front img{animation:none}
    .card.dealing{transition:none} #again{transition:none}
  }
</style>
</head>
<body>

<div id="board" aria-label="משחק הזיכרון"></div>
<button id="again">עוד פעם</button>

<div id="ending" aria-hidden="true">
  <video id="ending-vid" src="end-v1.mp4" muted playsinline webkit-playsinline preload="auto"></video>
</div>

<div id="start">
  <h1>מי מסתתר כאן?</h1>
  <p>מצאו את הזוגות. כל זוג משמיע את הצליל שלו.</p>
  <button id="go">אפשר להתחיל</button>
</div>

<button id="mute" aria-label="מוזיקה" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9.5h3.4L12 5.4v13.2L7.4 14.5H4z" fill="currentColor"/>
    <g class="waves" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none">
      <path d="M15.4 9.3a4 4 0 0 1 0 5.4"/>
      <path d="M18 7a7.4 7.4 0 0 1 0 10"/>
    </g>
    <path class="slash" d="M15.6 9.6l4.8 4.8M20.4 9.6l-4.8 4.8"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>
</button>

<audio id="player" preload="none" playsinline></audio>
<audio id="bgm" src="snd/bg.mp3" loop preload="auto" playsinline></audio>

<script>
(function(){
  var BASE='https://hanibarsol.github.io/sol-virtualpiano/';
  var CAST=[
    {id:'do',  img:'%D7%93%D7%95.png',       note:'c4', col:'--c-do', anim:1},
    {id:'re',  img:'%D7%A8%D7%94.png',       note:'d4', col:'--c-re', anim:1},
    {id:'mi',  img:'%D7%9E%D7%99.png',       note:'e4', col:'--c-mi', anim:1},
    {id:'fa',  img:'%D7%A4%D7%94.png',       note:'f4', col:'--c-fa',  anim:1},
    {id:'sol', img:'%D7%A1%D7%95%D7%9C.png', note:'g4', col:'--c-sol', anim:1},
    {id:'la',  img:'%D7%9C%D7%94.png',       note:'a4', col:'--c-la',  anim:1},
    {id:'si',  img:'%D7%A1%D7%99.png',       note:'b4', col:'--c-si',  anim:1},
    /* הזוג השמיני: כל המשפחה יחד. הוא ממלא את שתי המשבצות
       שנשארו ריקות ברשת של 4 על 4 בנייד. */
    {id:'family', img:'',                   note:'family-v5', col:'--c-do', anim:1}
  ];
  var DOTS=['#ff6b6b','#ffa35c','#f2cf52','#5fcb82','#5cacea','#9c86ea','#e37bcb'];

  var board=document.getElementById('board'),
      startEl=document.getElementById('start'),
      goBtn=document.getElementById('go'),
      again=document.getElementById('again'),
      player=document.getElementById('player');

  var first=null, lock=true, found=0, lastOrder='';
  var bgm=document.getElementById('bgm'),
      muteBtn=document.getElementById('mute'),
      muted=false;

  /* באייפון אי אפשר להנמיך נגן דרך הקוד, ולכן עוצמת הרקע אפויה בתוך הקובץ.
     muted לעומת זאת כן נתמך, ועליו מבוסס הכפתור. */
  function setMuted(v){
    muted=v;
    bgm.muted=v;
    muteBtn.classList.toggle('off',v);
    muteBtn.setAttribute('aria-pressed', v?'true':'false');
    if(!v) startBgm();
  }
  function startBgm(){
    if(muted) return;
    try{ var q=bgm.play(); if(q&&q.catch) q.catch(function(){}); }catch(e){}
  }
  muteBtn.addEventListener('click',function(e){
    e.preventDefault(); e.stopPropagation();
    setMuted(!muted);
  });

  function play(src){
    try{
      player.pause(); player.currentTime=0;
      player.src=src;
      var p=player.play(); if(p&&p.catch) p.catch(function(){});
    }catch(e){}
  }
  /* הצלחה: פעמונים בלבד. צליל התו בוטל ב-2026-11-09 לבקשת חני, "לא נשמע טוב". */
  function matchSound(){ play('snd/bells.mp3'); }
  function shuffleSound(){ play('snd/shuffle.mp3'); }
  /* נקישת עץ, בחירת חני ב-2026-11-07 (הווש נדחה).
     הנעילה הזאת נשארת כאן כדי ששני קלפים שנסגרים יחד לא יישמעו כפול. */
  /* קלף שבוחרים וקלף שחוזר אינם אותו רגע, ולכן אינם אותו צליל.
     החזרה נמוכה ורכה יותר, אבל לא שלילית: טעות כאן אינה כישלון. */
  var FLIP='tok.mp3', BACK='back.mp3';
  var lastFlip=0;
  function flipSound(up){
    var t=Date.now();
    if(t-lastFlip<90) return;
    lastFlip=t;
    play('snd/'+(up?FLIP:BACK));
  }

  /* ערבוב פישר-ייטס, ולעולם לא אותה פריסה כמו במשחק הקודם */
  function shuffled(){
    var deck, key, guard=0;
    do{
      deck=CAST.concat(CAST).slice();
      for(var i=deck.length-1;i>0;i--){
        var j=Math.floor(Math.random()*(i+1));
        var t=deck[i]; deck[i]=deck[j]; deck[j]=t;
      }
      key=deck.map(function(c){return c.id;}).join(',');
    }while(key===lastOrder && ++guard<30);
    lastOrder=key;
    return deck;
  }

  function backSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">'+
      '<circle cx="9" cy="17" r="3.4" fill="#fff"/>'+
      '<path d="M12.4 17V5.2l7-1.6V14" stroke="#fff" stroke-width="2.1" stroke-linecap="round" fill="none"/>'+
      '<circle cx="16" cy="14" r="3.4" fill="#fff"/>'+
    '</svg>';
  }

  function turn(card,up){
    flipSound(up);
    var inner=card.querySelector('.inner');
    inner.classList.remove('flip'); void inner.offsetWidth; inner.classList.add('flip');
    if(up) card.classList.add('up'); else card.classList.remove('up');
  }

  function build(){
    board.innerHTML='';
    first=null; found=0; lock=true;
    again.classList.remove('show');

    shuffled().forEach(function(c,i){
      var card=document.createElement('div');
      card.className='card';
      card.dataset.id=c.id; card.dataset.note=c.note;
      card.setAttribute('role','button');
      /* לדמות עם הנפשה, תמונת הקלף היא הפריים הראשון של ההנפשה עצמה,
         ולכן המעבר ביניהן לא קופץ */
      var face = c.anim
        ? '<img src="anim/'+c.note+'.jpg" alt="">'+
          '<video class="clip" src="anim/'+c.note+'.mp4" muted loop playsinline preload="auto"></video>'
        : '<img src="'+BASE+c.img+'" alt="">';
      card.innerHTML='<div class="inner">'+
          '<div class="face back">'+backSvg()+'</div>'+
          '<div class="face front">'+face+'</div>'+
        '</div>';
      card.addEventListener('click',function(){ pick(card); });
      board.appendChild(card);
    });
  }

  /* ערבוב גלוי: הקלפים נאספים למרכז, מתערבבים, ונפרשים בחזרה */
  function dealOut(){
    var cards=[].slice.call(board.children);
    var br=board.getBoundingClientRect();
    var cx=br.left+br.width/2, cy=br.top+br.height/2;
    var home=cards.map(function(c){
      var r=c.getBoundingClientRect();
      return {dx:cx-(r.left+r.width/2), dy:cy-(r.top+r.height/2)};
    });

    cards.forEach(function(c,i){
      c.classList.remove('dealing');
      c.style.transform='translate('+home[i].dx+'px,'+home[i].dy+'px) scale(.62) rotate(0deg)';
    });

    shuffleSound();

    var round=0;
    var jitter=setInterval(function(){
      round++;
      cards.forEach(function(c,i){
        var rx=(Math.random()*34-17), ry=(Math.random()*18-9), rot=(Math.random()*26-13);
        c.classList.add('dealing');
        c.style.transition='transform .22s ease';
        c.style.transform='translate('+(home[i].dx+rx)+'px,'+(home[i].dy+ry)+'px) scale(.62) rotate('+rot+'deg)';
      });
      if(round>=4){
        clearInterval(jitter);
        cards.forEach(function(c,i){
          setTimeout(function(){
            c.style.transition='transform .4s cubic-bezier(.2,.9,.3,1)';
            c.style.transform='';
          }, i*46);
        });
        setTimeout(function(){
          cards.forEach(function(c){ c.style.transition=''; c.classList.remove('dealing'); });
          lock=false;                       /* רק עכשיו אפשר לשחק */
        }, cards.length*46+450);
      }
    },230);
  }

  function jumpOnly(card){
    card.classList.add('jump');
    setTimeout(function(){ card.classList.remove('jump'); },620);
  }

  /* זוג שנמצא ממשיך לנוע בלולאה עד סוף המשחק.
     התמונה נעלמת רק כשהדפדפן מדווח שההנפשה רצה, ולכן קלף לא יכול להישאר ריק.
     אם היא מתעכבת, הקלף פועם פעם אחת, וכשהיא כן מתחילה הוא עובר אליה. */
  function celebrate(card){
    var v=card.querySelector('video.clip');
    if(!v){ jumpOnly(card); return; }
    var started=false;
    v.addEventListener('playing', function(){
      started=true;
      card.classList.add('playing');
    }, {once:true});
    setTimeout(function(){ if(!started) jumpOnly(card); },600);
    try{ v.muted=true; v.loop=true; v.currentTime=0; var q=v.play(); if(q&&q.catch) q.catch(function(){}); }catch(e){}
  }

  function pick(card){
    if(lock) return;
    if(document.getElementById('ending').classList.contains('on')) return;
    if(card.classList.contains('up')||card.classList.contains('done')) return;

    turn(card,true);
    if(!first){ first=card; return; }

    if(first.dataset.id===card.dataset.id){
      lock=true;
      var a=first,b=card; first=null;
      setTimeout(function(){
        matchSound();
        a.classList.add('done'); b.classList.add('done');
        celebrate(a); celebrate(b);
        found++; lock=false;
        if(found===CAST.length) finish();
      },180);
    }else{
      lock=true;
      var x=first,y=card; first=null;
      setTimeout(function(){ turn(x,false); turn(y,false); lock=false; },900);
    }
  }

  /* כשהמנגינה מתחילה, הדמויות נחות וחוזרות לתמונה הרגילה בדהייה.
     הסרטונים לא רק נעצרים אלא **מוסרים מהדף**, כי לדפדפן יש מגבלה על
     כמה סרטונים מפוענחים יחד, וסרטון הסיום צריך את המקום. במשחק הבא
     הלוח נבנה מחדש וכולם חוזרים. */
  function restAll(){
    [].forEach.call(board.querySelectorAll('.card'), function(c){
      c.classList.remove('playing');
      var v=c.querySelector('video.clip');
      if(v){
        try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){}
        if(v.parentNode) v.parentNode.removeChild(v);
      }
    });
  }

  /* סרטון הסיום. עולה אחרי שהדמויות נחו, ואפשר לדלג בנגיעה.
     אם הוא לא יוצא לדרך, הכפתור מופיע כרגיל ושום דבר לא נתקע. */
  function playEnding(){
    var box=document.getElementById('ending'), v=document.getElementById('ending-vid');
    if(!box||!v){ again.classList.add('show'); return; }

    var done=false, started=false;
    function close(){
      if(done) return;
      done=true;
      box.classList.add('out');
      setTimeout(function(){
        box.classList.remove('on','vis','out');
        try{ v.pause(); }catch(e){}
        again.classList.add('show');
      }, 640);
    }

    box.classList.add('on');
    v.addEventListener('playing', function(){
      started=true;
      box.classList.add('vis');
      var left=Math.max(600,(v.duration||4.6)*1000 - v.currentTime*1000);
      setTimeout(close, left+120);
    }, {once:true});
    v.addEventListener('ended', close, {once:true});
    ['touchstart','mousedown'].forEach(function(ev){
      box.addEventListener(ev, function(e){ e.preventDefault(); close(); }, {passive:false});
    });

    try{
      v.muted=true;
      var q=v.play();
      if(q&&q.catch) q.catch(function(){ close(); });
    }catch(e){ close(); }

    setTimeout(function(){ if(!started) close(); }, 1800);
  }

  function finish(){
    /* בלי ניגון כל התווים בסוף, לבקשת חני ב-2026-11-07: "זה נשמע רע".
       במקומם מוזיקת סיום, שמתחילה רק אחרי שצליל הזוג האחרון נגמר. */
    setTimeout(function(){
      try{ bgm.pause(); }catch(e){}
      play('snd/win.mp3');
    }, 1500);
    /* ההנפשות ממשיכות עוד שלוש שניות לתוך המנגינה, ורק אז נחות */
    setTimeout(restAll, 4500);
    /* ואז המשפחה הולכת יחד אל האור. הכפתור מחכה לסוף הסרטון. */
    setTimeout(playEnding, 4700);
  }

  function newGame(){
    var box=document.getElementById('ending');
    if(box) box.classList.remove('on','vis','out');
    startBgm(); build(); requestAnimationFrame(function(){ dealOut(); });
  }

  goBtn.addEventListener('click',function(){
    startEl.hidden=true;
    muteBtn.classList.add('show');
    startBgm();          /* כאן, כי זאת הנגיעה האמיתית שאייפון דורש */
    newGame();
  });
  again.addEventListener('click',newGame);

  build();   /* לוח מוכן מאחורי מסך הפתיחה */
})();
</script>
</body>
</html>
