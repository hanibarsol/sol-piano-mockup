<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>הפסנתר של סול</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            background-color: #000; user-select: none; -webkit-user-select: none; 
            touch-action: none; 
        }

        #start-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); color: white; display: flex; 
            justify-content: center; align-items: center; z-index: 1000; 
            cursor: pointer; text-align: center; 
        }

        #start-screen h1 { font-size: 24px; line-height: 1.7; margin: 0; padding: 0 24px; }

        #piano-scroll-wrapper {
            width: 100vw; height: 100vh; overflow-x: auto; overflow-y: hidden;
            background-color: #000; display: flex;
        }

        #piano-container { 
            display: flex; height: 100%; width: 100%; min-width: 100vw; 
            padding: 0; margin: 0;
        }

        .piano { 
            display: flex; position: relative; direction: ltr; height: 100%; width: 100%;
        }
        
        .key { 
            position: relative; border: 1px solid #000; box-sizing: border-box; 
            display: flex; flex-direction: column; 
            justify-content: flex-end; 
            align-items: center; 
        }

        .white-key { 
            flex: 1 0 auto; width: 7.14vw; 
            height: 80%; background-color: white; z-index: 1; 
            border-radius: 0 0 10px 10px; 
        }

        .black-key { 
            width: 4.5vw; height: 40%; 
            background-color: #333; z-index: 2; 
            margin-left: -2.25vw; margin-right: -2.25vw; 
            border-radius: 0 0 6px 6px; 
        }
        
        .key.active { background-color: #ffeb3b !important; }

        .character-img { 
            width: 90%; height: auto; 
            max-height: 60%; 
            object-fit: contain; pointer-events: none; 
            margin-bottom: clamp(8px, calc(40vh - 82px), 60px); 
        }
    </style>
</head>
<body>

<div id="start-screen"><h1>סובבו את הטלפון לרוחב<br>וגעו במסך כדי להתחיל 🎹</h1></div>

<div id="piano-scroll-wrapper">
    <div id="piano-container">
        <div class="piano" id="piano"></div>
    </div>
</div>

<script>
    Tone.context.latencyHint = 'fastest';
    Tone.context.lookAhead = 0;

    const startScreen = document.getElementById('start-screen');
    let isMouseDown = false;

    const sampler = new Tone.Sampler({
        urls: {
            "C3": "c3.mp3", "C#3": "cd3.mp3", "D3": "d3.mp3", "D#3": "dd3.mp3", "E3": "e3.mp3",
            "F3": "f3.mp3", "F#3": "fd3.mp3", "G3": "g3.mp3", "G#3": "gd3.mp3", "A3": "a3.mp3", "A#3": "ad3.mp3", "B3": "b3.mp3",
            "C4": "c4.mp3", "C#4": "cd4.mp3", "D4": "d4.mp3", "D#4": "dd4.mp3", "E4": "e4.mp3",
            "F4": "f4.mp3", "F#4": "fd4.mp3", "G4": "g4.mp3", "G#4": "gd4.mp3", "A4": "a4.mp3", "A#4": "ad4.mp3", "B4": "b4.mp3"
        },
        baseUrl: "https://hanibarsol.github.io/sol-virtualpiano/sound3/",
        release: 4, 
        onload: () => console.log("המערכת מוכנה")
    }).toDestination();
    
    sampler.polyphony = 12;
    
    startScreen.addEventListener('click', async () => {
        await Tone.start();
        startScreen.style.display = 'none';
        initTouchControls(); // <--- מפעיל את הטאץ' רק אחרי שהמסך נסגר!
    });

    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const characterImages = ["https://hanibarsol.github.io/sol-virtualpiano/%D7%93%D7%95.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A8%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9E%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A4%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%95%D7%9C.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9C%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%93%D7%95.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A8%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9E%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A4%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%95%D7%9C.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9C%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%99.png"];
    const pianoElement = document.getElementById('piano');
    let whiteKeyIndex = 0;

    [3, 4].forEach(octave => {
        notes.forEach(note => {
            const isBlack = note.includes('#');
            const fullNote = note + octave;
            const key = document.createElement('div');
            key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
            key.dataset.note = fullNote;

            if (!isBlack) {
                const topSpacer = document.createElement('div');
                topSpacer.style.flexGrow = "1";
                topSpacer.style.minHeight = "10px";
                key.appendChild(topSpacer);

                const img = document.createElement('img');
                img.src = characterImages[whiteKeyIndex] || "";
                img.className = 'character-img';
                key.appendChild(img);

                whiteKeyIndex++;
            }

            const play = () => {
                key.classList.add('active');
                sampler.triggerAttack(fullNote);
            };
            const stop = () => {
                key.classList.remove('active');
                sampler.triggerRelease(fullNote);
            };

            // אירועי עכבר למחשב
            key.onmousedown = (e) => { e.preventDefault(); isMouseDown = true; play(); };
            key.onmouseup = () => { isMouseDown = false; stop(); };
            key.onmouseenter = () => { if (isMouseDown) play(); };
            key.onmouseleave = stop;

            pianoElement.appendChild(key);
        });
    });

    // --- עטפנו את מנגנון הטאץ' בפונקציה ---
    function initTouchControls() {
        let activeTouchedKey = null;

        const getKeyFromTouch = (touch) => {
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!el) return null;
            return el.closest('.key');
        };

        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const key = getKeyFromTouch(touch);
            
            if (key) {
                activeTouchedKey = key;
                key.classList.add('active');
                sampler.triggerAttack(key.dataset.note);
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const currentKey = getKeyFromTouch(touch);

            if (currentKey !== activeTouchedKey) {
                if (activeTouchedKey) {
                    activeTouchedKey.classList.remove('active');
                    sampler.triggerRelease(activeTouchedKey.dataset.note);
                }
                
                if (currentKey) {
                    currentKey.classList.add('active');
                    sampler.triggerAttack(currentKey.dataset.note);
                }
                
                activeTouchedKey = currentKey;
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (activeTouchedKey) {
                activeTouchedKey.classList.remove('active');
                sampler.triggerRelease(activeTouchedKey.dataset.note);
                activeTouchedKey = null;
            }
        }, { passive: false });
    }

</script>
<style>
  /* הקלידים יורדים ב-20vh ושומרים בדיוק על גובהם: 80vh ללבן, 40vh לשחור */
  #piano-scroll-wrapper{ height:80vh !important; margin-top:20vh; }
  .white-key{ height:100% !important; }
  .black-key{ height:50% !important; }

  /* ===== פאנל הבקרה, בסגנון כלי נגינה ===== */
  #panel{
    position:fixed; top:0; left:0; right:0; height:20vh; z-index:400;
    background:linear-gradient(180deg,#34343a 0%,#232328 42%,#17171b 100%);
    border-bottom:1px solid #000;
    display:flex; align-items:center; justify-content:center;
    gap:clamp(14px,4vw,42px);
    direction:rtl; font-family:system-ui,"Segoe UI",sans-serif;
    overflow:hidden;
  }
  /* שיוף מתכתי עדין */
  #panel::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px);
  }
  /* קו אור בתחתית, שם שהקלידים מתחילים */
  #panel::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:#189E8A; box-shadow:0 0 10px 1px rgba(24,158,138,.85);
  }

  .pad-wrap{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; gap:clamp(3px,1.1vh,7px);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .pad{
    width:clamp(34px,11vh,54px); height:clamp(34px,11vh,54px);
    border-radius:clamp(6px,1.8vh,10px);
    border:1px solid rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .pad svg{ width:58%; height:58%; display:block; }
  .pad-wrap span{
    color:#EDEDF2; font-size:clamp(8px,2.6vh,13px); font-weight:800;
    white-space:nowrap; text-shadow:0 1px 2px #000;
  }
  .pad-wrap.pressed .pad{ transform:scale(.9); }

  .p1 .pad{ background:linear-gradient(180deg,#5B8AD6,#3B6BB2);
            box-shadow:0 0 12px 2px rgba(59,107,178,.75), inset 0 1px 0 rgba(255,255,255,.4); }
  .p2 .pad{ background:linear-gradient(180deg,#FFC24A,#F2A412);
            box-shadow:0 0 12px 2px rgba(242,164,18,.75), inset 0 1px 0 rgba(255,255,255,.45); }
  .p3 .pad{ background:linear-gradient(180deg,#2FC3AC,#189E8A);
            box-shadow:0 0 12px 2px rgba(24,158,138,.75), inset 0 1px 0 rgba(255,255,255,.4); }
</style>

<div id="panel">
  <div class="pad-wrap p1">
    <div class="pad">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3.5 5.4c3-1.2 5.5-1.2 8.5.4 3-1.6 5.5-1.6 8.5-.4v13.2c-3-1.2-5.5-1.2-8.5.4-3-1.6-5.5-1.6-8.5-.4V5.4Z" fill="#fff"/>
        <path d="M12 5.8v13.2" stroke="#3B6BB2" stroke-width="1.4"/>
      </svg>
    </div>
    <span>הסיפור של המשפחה</span>
  </div>

  <div class="pad-wrap p2">
    <div class="pad">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="2.6" y="2.6" width="8.6" height="8.6" rx="1.7" fill="#fff"/>
        <rect x="12.8" y="2.6" width="8.6" height="8.6" rx="1.7" fill="#fff" opacity=".5"/>
        <rect x="2.6" y="12.8" width="8.6" height="8.6" rx="1.7" fill="#fff" opacity=".5"/>
        <rect x="12.8" y="12.8" width="8.6" height="8.6" rx="1.7" fill="#fff"/>
      </svg>
    </div>
    <span>משחק הזיכרון</span>
  </div>

  <div class="pad-wrap p3">
    <div class="pad">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M2.5 6.5h19M2.5 10.3h19M2.5 14.1h19M2.5 17.9h19" stroke="#fff" stroke-width="1.1" opacity=".75"/>
        <circle cx="8.4" cy="16" r="2.7" fill="#fff"/>
        <path d="M11.1 16V6.2l6.6-1.5v9.6" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round"/>
        <circle cx="15" cy="14.3" r="2.7" fill="#fff"/>
      </svg>
    </div>
    <span>ללמוד תווים</span>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.pad-wrap').forEach(function(w){
    ['touchstart','mousedown'].forEach(function(ev){
      w.addEventListener(ev,function(e){
        e.preventDefault(); e.stopPropagation();
        w.classList.add('pressed');
        setTimeout(function(){ w.classList.remove('pressed'); },200);
      },{passive:false});
    });
  });
})();
</script>
</body>
</html>
