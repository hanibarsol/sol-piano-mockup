<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>הפסנתר של סול</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            background-color: #000; user-select: none; -webkit-user-select: none; 
            touch-action: none; 
        }

        #start-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); color: white; display: flex; 
            justify-content: center; align-items: center; z-index: 1000; 
            cursor: pointer; text-align: center; 
        }

        #start-screen h1 {
            font-size: 24px; line-height: 1.7; margin: 0; padding: 0 24px;
            position: relative; z-index: 2;
            text-shadow: 0 2px 14px rgba(0,0,0,.75);
        }

        /* לאורך הפסנתר פשוט לא נחשף. בלי זה הוא נראה מעוך וכמו תקלה. */
        @media (orientation: portrait) {
            #start-screen { display: flex !important; background: #140820; }
            #piano-scroll-wrapper { visibility: hidden; }
        }

        /* ---------- בועות הכניסה ---------- */
        #bubbles {
            position: absolute; inset: 0; overflow: hidden;
            z-index: 1; pointer-events: none;
        }
        #bubbles i {
            position: absolute; bottom: -22vmin; display: block;
            width: var(--d); height: var(--d); border-radius: 50%;
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,.92) 0 6%, rgba(255,255,255,.28) 14%, rgba(255,255,255,0) 42%),
                radial-gradient(circle at 50% 50%, var(--c) 0 58%, rgba(255,255,255,.14) 78%, rgba(255,255,255,.34) 100%);
            box-shadow: inset 0 0 14px rgba(255,255,255,.35), 0 0 18px var(--c);
            opacity: 0;
            animation: rise var(--t) linear var(--delay) infinite;
        }
        @keyframes rise {
            0%   { transform: translate3d(0,0,0) scale(.72);        opacity: 0 }
            12%  {                                                   opacity: .85 }
            50%  { transform: translate3d(var(--sway),-58vh,0) scale(1) }
            88%  {                                                   opacity: .7 }
            100% { transform: translate3d(0,-118vh,0) scale(1.08);   opacity: 0 }
        }

        /* בנגיעה הבועות מתפוצצות החוצה */
        #start-screen.pop #bubbles i {
            animation: burst .5s cubic-bezier(.2,.8,.3,1) forwards;
        }
        @keyframes burst {
            0%   { opacity: .85 }
            100% { transform: translate3d(var(--bx),var(--by),0) scale(1.9); opacity: 0 }
        }
        #start-screen.pop { transition: opacity .42s ease .12s; opacity: 0 }

        @media (prefers-reduced-motion: reduce) {
            #bubbles i { animation: none; opacity: .5 }
            #start-screen.pop #bubbles i { animation: none }
        }

        #piano-scroll-wrapper {
            width: 100vw; height: 100vh; overflow-x: auto; overflow-y: hidden;
            background-color: #000; display: flex;
        }

        #piano-container { 
            display: flex; height: 100%; width: 100%; min-width: 100vw; 
            padding: 0; margin: 0;
        }

        .piano { 
            display: flex; position: relative; direction: ltr; height: 100%; width: 100%;
        }
        
        .key { 
            position: relative; border: 1px solid #000; box-sizing: border-box; 
            display: flex; flex-direction: column; 
            justify-content: flex-end; 
            align-items: center; 
        }

        .white-key { 
            flex: 1 0 auto; width: 7.14vw; 
            height: 80%; background-color: white; z-index: 1; 
            border-radius: 0 0 10px 10px; 
        }

        .black-key { 
            width: 4.5vw; height: 40%; 
            background-color: #333; z-index: 2; 
            margin-left: -2.25vw; margin-right: -2.25vw; 
            border-radius: 0 0 6px 6px; 
        }
        
        .key.active { background-color: #ffeb3b !important; }

        .character-img { 
            width: 90%; height: auto; 
            max-height: 60%; 
            object-fit: contain; pointer-events: none; 
            margin-bottom: clamp(8px, calc(40vh - 82px), 60px); 
        }
    </style>
</head>
<body>

<div id="start-screen"><div id="bubbles"></div><h1>סובבו את הטלפון לרוחב<br>וגעו במסך כדי להתחיל 🎹</h1></div>

<div id="piano-scroll-wrapper">
    <div id="piano-container">
        <div class="piano" id="piano"></div>
    </div>
</div>

<script>
    Tone.context.latencyHint = 'fastest';
    Tone.context.lookAhead = 0;

    const startScreen = document.getElementById('start-screen');

    /* בועות הכניסה. הצבעים הם צבעי התווים הקבועים של המשפחה. */
    (function(){
        const COLS = ['#ff6b6b','#ffa35c','#f2cf52','#5fcb82','#5cacea','#9c86ea','#e37bcb'];
        const host = document.getElementById('bubbles');
        const frag = document.createDocumentFragment();
        for (let i = 0; i < 16; i++) {
            const b = document.createElement('i');
            const d = 7 + Math.random() * 13;
            b.style.setProperty('--d', d.toFixed(1) + 'vmin');
            b.style.setProperty('--c', COLS[i % COLS.length]);
            b.style.setProperty('--t', (7 + Math.random() * 7).toFixed(1) + 's');
            b.style.setProperty('--delay', (-Math.random() * 12).toFixed(1) + 's');
            b.style.setProperty('--sway', (Math.random() * 16 - 8).toFixed(1) + 'vw');
            b.style.left = (Math.random() * 92).toFixed(1) + '%';
            b.style.setProperty('--bx', (Math.random() * 70 - 35).toFixed(0) + 'vw');
            b.style.setProperty('--by', (Math.random() * 70 - 35).toFixed(0) + 'vh');
            frag.appendChild(b);
        }
        host.appendChild(frag);
    })();
    let isMouseDown = false;

    const sampler = new Tone.Sampler({
        urls: {
            "C3": "c3.mp3", "C#3": "cd3.mp3", "D3": "d3.mp3", "D#3": "dd3.mp3", "E3": "e3.mp3",
            "F3": "f3.mp3", "F#3": "fd3.mp3", "G3": "g3.mp3", "G#3": "gd3.mp3", "A3": "a3.mp3", "A#3": "ad3.mp3", "B3": "b3.mp3",
            "C4": "c4.mp3", "C#4": "cd4.mp3", "D4": "d4.mp3", "D#4": "dd4.mp3", "E4": "e4.mp3",
            "F4": "f4.mp3", "F#4": "fd4.mp3", "G4": "g4.mp3", "G#4": "gd4.mp3", "A4": "a4.mp3", "A#4": "ad4.mp3", "B4": "b4.mp3"
        },
        baseUrl: "https://hanibarsol.github.io/sol-virtualpiano/sound3/",
        release: 4, 
        onload: () => console.log("המערכת מוכנה")
    }).toDestination();
    
    sampler.polyphony = 12;
    
    /* הנגיעה פותחת את השמע, אבל המסך נסגר רק לרוחב.
       לאורך הבועות ממשיכות לעלות ומחכות שיסובבו את המכשיר. */
    const landscape = window.matchMedia('(orientation: landscape)');
    let touched = false;

    function leaveStartScreen(){
        if (!touched || !landscape.matches) return;
        if (startScreen.classList.contains('pop')) return;
        startScreen.classList.add('pop');
        setTimeout(function(){ startScreen.style.display = 'none'; }, 520);
    }

    startScreen.addEventListener('click', async () => {
        await Tone.start();
        touched = true;
        initTouchControls();   /* הקלידים מוכנים גם אם עוד לא סובבו */
        leaveStartScreen();
    });

    /* שלושה מאזינים, כי matchMedia לבדו לא תמיד נורה בסיבוב */
    if (landscape.addEventListener) landscape.addEventListener('change', leaveStartScreen);
    else if (landscape.addListener) landscape.addListener(leaveStartScreen);
    window.addEventListener('resize', leaveStartScreen);
    window.addEventListener('orientationchange', function(){ setTimeout(leaveStartScreen, 120); });

    /* רשת ביטחון: בדיקה תקופתית כל עוד מסך הפתיחה פתוח.
       באייפון אירועי הסיבוב לא תמיד מגיעים, ובלי זה המסך נשאר תקוע מעל הפסנתר. */
    const watch = setInterval(function(){
        if (startScreen.style.display === 'none') { clearInterval(watch); return; }
        leaveStartScreen();
    }, 300);

    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const characterImages = ["https://hanibarsol.github.io/sol-virtualpiano/%D7%93%D7%95.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A8%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9E%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A4%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%95%D7%9C.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9C%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%93%D7%95.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A8%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9E%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A4%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%95%D7%9C.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9C%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%99.png"];
    const pianoElement = document.getElementById('piano');
    let whiteKeyIndex = 0;

    [3, 4].forEach(octave => {
        notes.forEach(note => {
            const isBlack = note.includes('#');
            const fullNote = note + octave;
            const key = document.createElement('div');
            key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
            key.dataset.note = fullNote;

            if (!isBlack) {
                const topSpacer = document.createElement('div');
                topSpacer.style.flexGrow = "1";
                topSpacer.style.minHeight = "10px";
                key.appendChild(topSpacer);

                const img = document.createElement('img');
                img.src = characterImages[whiteKeyIndex] || "";
                img.className = 'character-img';
                key.appendChild(img);

                whiteKeyIndex++;
            }

            const play = () => {
                key.classList.add('active');
                sampler.triggerAttack(fullNote);
            };
            const stop = () => {
                key.classList.remove('active');
                sampler.triggerRelease(fullNote);
            };

            // אירועי עכבר למחשב
            key.onmousedown = (e) => { e.preventDefault(); isMouseDown = true; play(); };
            key.onmouseup = () => { isMouseDown = false; stop(); };
            key.onmouseenter = () => { if (isMouseDown) play(); };
            key.onmouseleave = stop;

            pianoElement.appendChild(key);
        });
    });

    // --- עטפנו את מנגנון הטאץ' בפונקציה ---
    function initTouchControls() {
        let activeTouchedKey = null;

        const getKeyFromTouch = (touch) => {
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!el) return null;
            return el.closest('.key');
        };

        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const key = getKeyFromTouch(touch);
            
            if (key) {
                activeTouchedKey = key;
                key.classList.add('active');
                sampler.triggerAttack(key.dataset.note);
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const currentKey = getKeyFromTouch(touch);

            if (currentKey !== activeTouchedKey) {
                if (activeTouchedKey) {
                    activeTouchedKey.classList.remove('active');
                    sampler.triggerRelease(activeTouchedKey.dataset.note);
                }
                
                if (currentKey) {
                    currentKey.classList.add('active');
                    sampler.triggerAttack(currentKey.dataset.note);
                }
                
                activeTouchedKey = currentKey;
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (activeTouchedKey) {
                activeTouchedKey.classList.remove('active');
                sampler.triggerRelease(activeTouchedKey.dataset.note);
                activeTouchedKey = null;
            }
        }, { passive: false });
    }

</script>
<style>
  /* הקלידים יורדים ב-20vh ושומרים בדיוק על גובהם: 80vh ללבן, 40vh לשחור */
  #piano-scroll-wrapper{ height:80vh !important; margin-top:20vh; }
  .white-key{ height:100% !important; }
  .black-key{ height:50% !important; }

  /* ===== פאנל הבקרה, בסגנון כלי נגינה ===== */
  #panel{
    position:fixed; top:0; left:0; right:0; height:20vh; z-index:400;
    background:linear-gradient(180deg,#34343a 0%,#232328 42%,#17171b 100%);
    border-bottom:1px solid #000;
    display:flex; align-items:center; justify-content:center;
    gap:clamp(14px,4vw,42px);
    direction:rtl; font-family:system-ui,"Segoe UI",sans-serif;
    overflow:hidden;
  }
  /* שיוף מתכתי עדין */
  #panel::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,0) 1px 3px);
  }
  /* קו אור בתחתית, שם שהקלידים מתחילים */
  #panel::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:#189E8A; box-shadow:0 0 10px 1px rgba(24,158,138,.85);
  }

  .pad-wrap{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; gap:clamp(3px,1.1vh,7px);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .pad{
    width:clamp(34px,11vh,54px); height:clamp(34px,11vh,54px);
    border-radius:clamp(6px,1.8vh,10px);
    border:1px solid rgba(255,255,255,.35);

    transition:transform .12s ease, box-shadow .12s ease;

  .pad svg{ width:58%; height:58%; display:block; }
  .pad-wrap span{
    color:#EDEDF2; font-size:clamp(8px,2.6vh,13px); font-weight:800;
    white-space:nowrap; text-shadow:0 1px 2px #000;
  }
  .pad-wrap.pressed .pad{ transform:scale(.9); }

  .p1 .pad{ background:linear-gradient(180deg,#5B8AD6,#3B6BB2);
            box-shadow:0 0 12px 2px rgba(59,107,178,.75), inset 0 1px 0 rgba(255,255,255,.4); }
  .p2 .pad{ background:linear-gradient(180deg,#FFC24A,#F2A412);
            box-shadow:0 0 12px 2px rgba(242,164,18,.75), inset 0 1px 0 rgba(255,255,255,.45); }
  .p3 .pad{ background:linear-gradient(180deg,#2FC3AC,#189E8A);
            box-shadow:0 0 12px 2px rgba(24,158,138,.75), inset 0 1px 0 rgba(255,255,255,.4); }
</style>

<script>
(function(){
  document.querySelectorAll('.pad-wrap').forEach(function(w){
    ['touchstart','mousedown'].forEach(function(ev){
      w.addEventListener(ev,function(e){
        e.preventDefault(); e.stopPropagation();
        w.classList.add('pressed');
        setTimeout(function(){ w.classList.remove('pressed'); },200);
      },{passive:false});
    });
  });
})();
</script>

<script>
(function(){
  var btn=document.getElementById('fsbtn'),
      how=document.getElementById('howto'),
      close=document.getElementById('howto-close'),
      el=document.documentElement;
  document.getElementById('panel').appendChild(btn);

  function canFs(){
    return !!(el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen);
  }
  function isFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function exitFs(){
    (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
  }
  function enterFs(){
    var r=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    try{
      var p=r.call(el);
      if(p&&p.catch) p.catch(function(){ how.classList.add('open'); });
    }catch(e){ how.classList.add('open'); }
  }

  function tap(e){
    e.preventDefault(); e.stopPropagation();
    btn.classList.add('pressed');
    setTimeout(function(){ btn.classList.remove('pressed'); },180);
    if(!canFs()){ how.classList.add('open'); return; }
    if(isFs()) exitFs(); else enterFs();
  }
  ['touchstart','mousedown'].forEach(function(ev){
    btn.addEventListener(ev,tap,{passive:false});
    close.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); how.classList.remove('open'); },{passive:false});
    how.addEventListener(ev,function(e){ if(e.target===how){ e.preventDefault(); e.stopPropagation(); how.classList.remove('open'); } },{passive:false});
  });
})();
</script>

<script>
/* אקורדים: החלפת מנגנון המגע כך שכל אצבע מנוהלת בנפרד.
   הפונקציה המקורית נקראת רק אחרי מסך הפתיחה, ולכן מספיק להחליף אותה כאן. */
window.initTouchControls = function(){
  var byFinger = {};           /* מזהה אצבע -> הקליד שהיא מחזיקה */
  var holds = new WeakMap();   /* קליד -> כמה אצבעות מחזיקות אותו */

  function keyAt(t){
    var el = document.elementFromPoint(t.clientX, t.clientY);
    return el ? el.closest('.key') : null;
  }
  function press(k){
    if(!k) return;
    var n = (holds.get(k) || 0) + 1;
    holds.set(k, n);
    if(n === 1){                       /* רק האצבע הראשונה מתחילה את הצליל */
      k.classList.add('active');
      try{ sampler.triggerAttack(k.dataset.note); }catch(err){}
    }
  }
  function lift(k){
    if(!k) return;
    var n = (holds.get(k) || 1) - 1;
    holds.set(k, n < 0 ? 0 : n);
    if(n <= 0){                        /* רק כשהאצבע האחרונה עזבה */
      k.classList.remove('active');
      try{ sampler.triggerRelease(k.dataset.note); }catch(err){}
    }
  }
  function offLimits(e){
    return !!(e.target.closest && (e.target.closest('#panel') || e.target.closest('#howto') || e.target.closest('#game')));
  }

  document.addEventListener('touchstart', function(e){
    if(offLimits(e)) return;
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i], k = keyAt(t);
      if(k){ byFinger[t.identifier] = k; press(k); }
    }
  }, {passive:false});

  document.addEventListener('touchmove', function(e){
    if(offLimits(e)) return;
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i], k = keyAt(t), prev = byFinger[t.identifier];
      if(k !== prev){
        if(prev) lift(prev);
        if(k){ press(k); byFinger[t.identifier] = k; }
        else { delete byFinger[t.identifier]; }
      }
    }
  }, {passive:false});

  function finger_up(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i], prev = byFinger[t.identifier];
      if(prev){ lift(prev); delete byFinger[t.identifier]; }
    }
  }
  document.addEventListener('touchend', finger_up, {passive:false});
  document.addEventListener('touchcancel', finger_up, {passive:false});
};
</script>

(function(){

  var box=document.getElementById('game'), back=document.getElementById('game-back');
  ['touchstart','mousedown'].forEach(function(ev){
    back.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); box.classList.remove('open'); },{passive:false});
  });

<script>
(function(){
  var VIDEO='https://www.youtube-nocookie.com/embed/vUjIHSO2kzI?rel=0&playsinline=1&modestbranding=1';
  var box=document.getElementById('game'),
      frame=document.getElementById('game-frame'),
      back=document.getElementById('game-back'),
      padVideo=document.querySelector('.pad-wrap.p1');

  frame.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');
  frame.setAttribute('allowfullscreen','');

  var kind=null;

  function openVideo(e){
    e.preventDefault(); e.stopPropagation();
    kind='video';
    frame.title='הסיפור של המשפחה';
    if(frame.src!==VIDEO) frame.src=VIDEO;
    box.classList.add('open');
  }
  ['touchstart','mousedown'].forEach(function(ev){
    if(padVideo) padVideo.addEventListener(ev,openVideo,{passive:false});
    /* בסגירה: סרטון חייב להיפסק, משחק נשאר כדי לא לאבד התקדמות */
    back.addEventListener(ev,function(){
      if(kind==='video'){ frame.src='about:blank'; kind=null; }
    },{passive:false});
  });
  /* הכרית הכתומה: משחק הזיכרון. נשאר טעון כדי לא לאבד התקדמות */
  var GAME='memory/';
  var padGame=document.querySelector('.pad-wrap.p2');
  function openGame(e){
    e.preventDefault(); e.stopPropagation();
    kind='game';
    frame.title='מי מסתתר כאן?';
    if(frame.src.indexOf(GAME)<0) frame.src=GAME;
    box.classList.add('open');
  }
  if(padGame) ['touchstart','mousedown'].forEach(function(ev){
    padGame.addEventListener(ev,openGame,{passive:false});
  });
})();
</script>
