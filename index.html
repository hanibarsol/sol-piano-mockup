<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>הפסנתר של סול</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; 
            background-color: #000; user-select: none; -webkit-user-select: none; 
            touch-action: none; 
        }

        #start-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); color: white; display: flex; 
            justify-content: center; align-items: center; z-index: 1000; 
            cursor: pointer; text-align: center; 
        }

        #start-screen h1 { font-size: 24px; line-height: 1.7; margin: 0; padding: 0 24px; }

        #piano-scroll-wrapper {
            width: 100vw; height: 100vh; overflow-x: auto; overflow-y: hidden;
            background-color: #000; display: flex;
        }

        #piano-container { 
            display: flex; height: 100%; width: 100%; min-width: 100vw; 
            padding: 0; margin: 0;
        }

        .piano { 
            display: flex; position: relative; direction: ltr; height: 100%; width: 100%;
        }
        
        .key { 
            position: relative; border: 1px solid #000; box-sizing: border-box; 
            display: flex; flex-direction: column; 
            justify-content: flex-end; 
            align-items: center; 
        }

        .white-key { 
            flex: 1 0 auto; width: 7.14vw; 
            height: 80%; background-color: white; z-index: 1; 
            border-radius: 0 0 10px 10px; 
        }

        .black-key { 
            width: 4.5vw; height: 40%; 
            background-color: #333; z-index: 2; 
            margin-left: -2.25vw; margin-right: -2.25vw; 
            border-radius: 0 0 6px 6px; 
        }
        
        .key.active { background-color: #ffeb3b !important; }

        .character-img { 
            width: 90%; height: auto; 
            max-height: 60%; 
            object-fit: contain; pointer-events: none; 
            margin-bottom: clamp(8px, calc(40vh - 82px), 60px); 
        }
    </style>
</head>
<body>

<div id="start-screen"><h1>סובבו את הטלפון לרוחב<br>וגעו במסך כדי להתחיל 🎹</h1></div>

<div id="piano-scroll-wrapper">
    <div id="piano-container">
        <div class="piano" id="piano"></div>
    </div>
</div>

<script>
    Tone.context.latencyHint = 'fastest';
    Tone.context.lookAhead = 0;

    const startScreen = document.getElementById('start-screen');
    let isMouseDown = false;

    const sampler = new Tone.Sampler({
        urls: {
            "C3": "c3.mp3", "C#3": "cd3.mp3", "D3": "d3.mp3", "D#3": "dd3.mp3", "E3": "e3.mp3",
            "F3": "f3.mp3", "F#3": "fd3.mp3", "G3": "g3.mp3", "G#3": "gd3.mp3", "A3": "a3.mp3", "A#3": "ad3.mp3", "B3": "b3.mp3",
            "C4": "c4.mp3", "C#4": "cd4.mp3", "D4": "d4.mp3", "D#4": "dd4.mp3", "E4": "e4.mp3",
            "F4": "f4.mp3", "F#4": "fd4.mp3", "G4": "g4.mp3", "G#4": "gd4.mp3", "A4": "a4.mp3", "A#4": "ad4.mp3", "B4": "b4.mp3"
        },
        baseUrl: "https://hanibarsol.github.io/sol-virtualpiano/sound3/",
        release: 4, 
        onload: () => console.log("המערכת מוכנה")
    }).toDestination();
    
    sampler.polyphony = 12;
    
    startScreen.addEventListener('click', async () => {
        await Tone.start();
        startScreen.style.display = 'none';
        initTouchControls(); // <--- מפעיל את הטאץ' רק אחרי שהמסך נסגר!
    });

    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const characterImages = ["https://hanibarsol.github.io/sol-virtualpiano/%D7%93%D7%95.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A8%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9E%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A4%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%95%D7%9C.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9C%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%93%D7%95.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A8%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9E%D7%99.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A4%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%95%D7%9C.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%9C%D7%94.png", "https://hanibarsol.github.io/sol-virtualpiano/%D7%A1%D7%99.png"];
    const pianoElement = document.getElementById('piano');
    let whiteKeyIndex = 0;

    [3, 4].forEach(octave => {
        notes.forEach(note => {
            const isBlack = note.includes('#');
            const fullNote = note + octave;
            const key = document.createElement('div');
            key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
            key.dataset.note = fullNote;

            if (!isBlack) {
                const topSpacer = document.createElement('div');
                topSpacer.style.flexGrow = "1";
                topSpacer.style.minHeight = "10px";
                key.appendChild(topSpacer);

                const img = document.createElement('img');
                img.src = characterImages[whiteKeyIndex] || "";
                img.className = 'character-img';
                key.appendChild(img);

                whiteKeyIndex++;
            }

            const play = () => {
                key.classList.add('active');
                sampler.triggerAttack(fullNote);
            };
            const stop = () => {
                key.classList.remove('active');
                sampler.triggerRelease(fullNote);
            };

            // אירועי עכבר למחשב
            key.onmousedown = (e) => { e.preventDefault(); isMouseDown = true; play(); };
            key.onmouseup = () => { isMouseDown = false; stop(); };
            key.onmouseenter = () => { if (isMouseDown) play(); };
            key.onmouseleave = stop;

            pianoElement.appendChild(key);
        });
    });

    // --- עטפנו את מנגנון הטאץ' בפונקציה ---
    function initTouchControls() {
        let activeTouchedKey = null;

        const getKeyFromTouch = (touch) => {
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (!el) return null;
            return el.closest('.key');
        };

        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const key = getKeyFromTouch(touch);
            
            if (key) {
                activeTouchedKey = key;
                key.classList.add('active');
                sampler.triggerAttack(key.dataset.note);
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const currentKey = getKeyFromTouch(touch);

            if (currentKey !== activeTouchedKey) {
                if (activeTouchedKey) {
                    activeTouchedKey.classList.remove('active');
                    sampler.triggerRelease(activeTouchedKey.dataset.note);
                }
                
                if (currentKey) {
                    currentKey.classList.add('active');
                    sampler.triggerAttack(currentKey.dataset.note);
                }
                
                activeTouchedKey = currentKey;
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (activeTouchedKey) {
                activeTouchedKey.classList.remove('active');
                sampler.triggerRelease(activeTouchedKey.dataset.note);
                activeTouchedKey = null;
            }
        }, { passive: false });
    }

</script>
<style>
  /* ===== לשונית קטנה בפינה הימנית העליונה ===== */
  #hub-tab{
    position:fixed; top:8px; right:8px; z-index:500;
    width:46px; height:46px; border-radius:50%;
    background:#43225A; border:3px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #hub-tab svg{width:26px;height:26px;display:block}

  /* ===== הפאנל, נפתח רק בנגיעה בלשונית ===== */
  #hub{
    position:fixed; inset:0; z-index:600; display:none;
    background:rgba(16,8,24,.88);
    align-items:center; justify-content:center;
    direction:rtl; font-family:system-ui,"Segoe UI",sans-serif;
  }
  #hub.open{display:flex}
  #hub-card{
    background:#43225A; border-radius:22px; padding:18px 22px 20px;
    box-shadow:0 10px 40px rgba(0,0,0,.6); text-align:center;
    max-width:92vw;
  }
  #hub-card h2{
    color:#fff; margin:0 0 14px; font-size:19px; font-weight:800; letter-spacing:.2px;
  }
  #hub-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .hub-btn{
    width:148px; min-height:104px; border-radius:16px; border:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    color:#fff; font-size:15px; font-weight:800; line-height:1.25; cursor:pointer;
    padding:10px 8px; box-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  .hub-btn small{display:block; font-size:12px; font-weight:600; opacity:.92}
  .b1{background:#3B6BB2}
  .b2{background:#F2A412}
  .b3{background:#189E8A}
  .hub-btn svg{width:34px;height:34px;display:block}
  #hub-close{
    margin-top:14px; background:none; border:none; color:#fff; opacity:.75;
    font-size:14px; font-weight:700; cursor:pointer;
  }
</style>

<div id="hub-tab" aria-label="עוד">
  <!-- דלת קטנה, אותה שפה של הדלת שעל הקליד -->
  <svg viewBox="0 0 24 24" fill="none">
    <rect x="4.5" y="2.5" width="15" height="19" rx="2.5" fill="#F2A412" stroke="#fff" stroke-width="1.6"/>
    <rect x="7.5" y="6" width="4" height="5" rx=".8" fill="#43225A"/>
    <rect x="12.5" y="6" width="4" height="5" rx=".8" fill="#43225A"/>
    <circle cx="9" cy="15.5" r="1.3" fill="#43225A"/>
  </svg>
</div>

<div id="hub">
  <div id="hub-card">
    <h2>מה עושים עכשיו?</h2>
    <div id="hub-row">
      <button class="hub-btn b1">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3.5 5.5c3-1.2 5.5-1.2 8.5.4 3-1.6 5.5-1.6 8.5-.4v13c-3-1.2-5.5-1.2-8.5.4-3-1.6-5.5-1.6-8.5-.4v-13Z" fill="#fff" opacity=".95"/>
          <path d="M12 5.9v13" stroke="#3B6BB2" stroke-width="1.5"/>
        </svg>
        הסיפור של המשפחה
      </button>
      <button class="hub-btn b2">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2.5" y="3.5" width="8.5" height="8.5" rx="1.6" fill="#fff"/>
          <rect x="13" y="3.5" width="8.5" height="8.5" rx="1.6" fill="#fff" opacity=".55"/>
          <rect x="2.5" y="13.5" width="8.5" height="8.5" rx="1.6" fill="#fff" opacity=".55"/>
          <rect x="13" y="13.5" width="8.5" height="8.5" rx="1.6" fill="#fff"/>
        </svg>
        משחק הזיכרון
      </button>
      <button class="hub-btn b3">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 7h18M3 11h18M3 15h18M3 19h18" stroke="#fff" stroke-width="1.3" opacity=".8"/>
          <circle cx="9" cy="15" r="2.6" fill="#fff"/>
          <path d="M11.6 15V5.6l6 -1.4V13" stroke="#fff" stroke-width="1.8" fill="none"/>
          <circle cx="15.6" cy="13.2" r="2.4" fill="#fff"/>
        </svg>
        ללמוד תווים
        <small>התנסות חינם</small>
      </button>
    </div>
    <button id="hub-close">חזרה לנגינה</button>
  </div>
</div>

<script>
  (function(){
    var tab=document.getElementById('hub-tab'), hub=document.getElementById('hub'),
        close=document.getElementById('hub-close');
    function open(e){ e.preventDefault(); e.stopPropagation(); hub.classList.add('open'); }
    function shut(e){ e.preventDefault(); e.stopPropagation(); hub.classList.remove('open'); }
    // טאץ' משלהם, כי הדף חוסם את מחוות הברירת מחדל
    ['touchstart','mousedown'].forEach(function(ev){
      tab.addEventListener(ev,open,{passive:false});
      close.addEventListener(ev,shut,{passive:false});
      hub.addEventListener(ev,function(e){ if(e.target===hub) shut(e); },{passive:false});
    });
  })();
</script>
<style>.hub-btn.pressed{transform:scale(.94);box-shadow:0 1px 0 rgba(0,0,0,.25)}</style>
<script>
(function(){
 document.querySelectorAll('.hub-btn').forEach(function(b){
  ['touchstart','mousedown'].forEach(function(ev){
    b.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();
      b.classList.add('pressed');setTimeout(function(){b.classList.remove('pressed')},220);},{passive:false});
  });
 });
})();
</script>
</body>
</html>
